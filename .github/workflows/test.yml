name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
        vite-version: [4, 5, 6, 7, 8]
      # 某个版本失败不影响其他版本的结果
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装指定 Vite 版本
        run: pnpm add -D vite@${{ matrix.vite-version }}

      - name: 构建
        run: pnpm build

      - name: 验证产物包含插件钩子
        run: |
          if grep -q "configResolved\|buildStart\|transform\|enforce" dist/index.mjs; then
            echo "✅ 产物包含 Vite 插件钩子"
          else
            echo "❌ 产物缺少插件钩子"
            exit 1
          fi
